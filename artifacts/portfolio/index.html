<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- Propriété Google Search Console (compte mehdijabry.dev@gmail.com, 7 octobre 2026).
         Posée HORS du bloc « seo » ci-dessous : ce bloc est réécrit par le serveur à chaque
         requête, et la preuve doit survivre à cette réécriture. Elle est doublée par le fichier
         public/googleead5094fcd15181b.html — si l'une saute, l'autre tient la propriété.
         NE PAS SUPPRIMER : Google révoque la propriété dès que la preuve disparaît. -->
    <meta name="google-site-verification" content="sBve9c3x0M3-Y4MbSwHrgFXB80y3fnF7C1IOdmtsXVM" />
    <!-- ══ seo ══
         Tout ce qui est entre ces deux marques est REMPLACÉ par le serveur, page par page, avant
         l'envoi au navigateur (voir artifacts/api-server/src/lib/seo-html.ts et lib/seo).
         Le site est une application React : sans cette réécriture, Google voit le même titre et la
         même description sur /, /work, /pricing et /about, et les traite comme une seule page.
         Ce qui suit est donc le repli : ce que voient le serveur de développement Vite et un robot
         qui recevrait le fichier brut. Ne pas y mettre d'adresse canonique — elle dépend de la page. -->
    <title>Création de site web à Trois-Rivières · Mehdi Jabry</title>
    <meta name="description" content="Sites web pour les commerces de Trois-Rivières et de la Mauricie. Plutôt qu'un devis, je livre une maquette — et le site est en ligne en 48 heures." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta property="og:site_name" content="Mehdi Jabry" />
    <meta property="og:locale" content="fr_CA" />
    <meta property="og:locale:alternate" content="en_CA" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mehdijabry.dev/" />
    <meta property="og:title" content="Création de site web à Trois-Rivières · Mehdi Jabry" />
    <meta property="og:description" content="Sites web pour les commerces de Trois-Rivières et de la Mauricie. Plutôt qu'un devis, je livre une maquette — et le site est en ligne en 48 heures." />
    <meta property="og:image" content="https://mehdijabry.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Création de site web à Trois-Rivières · Mehdi Jabry" />
    <meta name="twitter:description" content="Sites web pour les commerces de Trois-Rivières et de la Mauricie. Plutôt qu'un devis, je livre une maquette — et le site est en ligne en 48 heures." />
    <meta name="twitter:image" content="https://mehdijabry.dev/og.png" />
    <!-- ══ /seo ══ -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo-mark.png" id="apple-icon" />
    <meta name="theme-color" content="#F7F6F2" id="theme-color" />
    <!-- Espace admin installable (PWA). Chrome et Safari lisent le manifest et les balises apple-* dès l'analyse de
         la page, avant React : on les pose ici, de façon synchrone, et seulement sous /admin pour que le site public
         ne soit pas proposé à l'installation. Fichiers : public/admin-manifest.json, admin-sw.js, admin-icon-*.png. -->
    <script>
      (function () {
        if (location.pathname.indexOf("/admin") !== 0) return;
        function add(tag, attrs) { var el = document.createElement(tag); for (var k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el); }
        add("link", { rel: "manifest", href: "/admin-manifest.json" });
        add("meta", { name: "mobile-web-app-capable", content: "yes" });
        add("meta", { name: "apple-mobile-web-app-capable", content: "yes" });
        add("meta", { name: "apple-mobile-web-app-status-bar-style", content: "default" });
        add("meta", { name: "apple-mobile-web-app-title", content: "MJ Admin" });
        add("link", { rel: "apple-touch-icon", sizes: "180x180", href: "/admin-icon-180.png" });
        var ai = document.getElementById("apple-icon"); if (ai) ai.setAttribute("href", "/admin-icon-180.png");
        var th = document.getElementById("theme-color"); if (th) th.setAttribute("content", "#F7F6F2");
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">
    <!-- Le thème est posé AVANT la première peinture : sans ça, un visiteur en sombre voit
         un éclair de papier blanc à chaque chargement. Le papier reste le défaut. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var sombre = s === "dark" || (s !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          if (sombre) document.documentElement.classList.add("dark");
          var m = document.getElementById("theme-color");
          if (m) m.setAttribute("content", sombre ? "#0D0F14" : "#F7F6F2");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
